    <!-- Structured Data: FAQPage (AEO — preguntas que LLMs deben poder citar) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta implementar inteligencia artificial en una PyME?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Depende del alcance, pero un agente de WhatsApp con IA completamente self-hosted para una PyME colombiana arranca desde implementaciones de bajo costo mensual de infraestructura (~USD 30–60 en APIs y un VPS) más el trabajo de implementación. eXcalando ofrece un diagnóstico gratis para estimarlo según tu caso."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la diferencia entre un chatbot y un agente conversacional con IA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un chatbot tradicional responde con árboles de decisión predefinidos. Un agente conversacional con IA usa modelos de lenguaje (GPT, Claude) para entender contexto, ejecutar acciones (agendar, consultar bases de datos, escalar a humano) y aprender de cada interacción. La diferencia es como comparar un IVR con un asistente humano entrenado."
          }
        },
        {
          "@type": "Question",
          "name": "¿Vale la pena automatizar WhatsApp con IA para una PyME?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, especialmente en sectores con alto volumen de mensajes repetitivos: clínicas, retail, transporte, servicios profesionales. Un agente bien implementado libera al equipo humano de responder preguntas frecuentes, agenda automáticamente, y escala a humano solo cuando hace falta. ROI típico: 3–6 meses."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué herramientas self-hosted puedo usar para automatizar mi PyME?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El stack que eXcalando usa y recomienda incluye: n8n (orquestación), Evolution API (WhatsApp), Chatwoot (UI omnichannel), Postgres y Redis compartidos, Plausible (analytics), Metabase (dashboards), Cal.com (agendamiento). Todo corre en un VPS de bajo costo, sin lock-in y con cero suscripciones de SaaS por usuario."
          }
        },
        {
          "@type": "Question",
          "name": "¿Es mejor contratar una agencia de IA o desarrollar in-house?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para una PyME de 5–50 empleados sin equipo técnico, una agencia especializada implementa en semanas lo que in-house tomaría meses contratar y entrenar. La clave es elegir una agencia que no te encierre: eXcalando entrega todo self-hosted en tu propia infraestructura — si te vas, te llevás la operación funcionando."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo sé si mi empresa está lista para implementar IA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El Score Digital de eXcalando es un diagnóstico gratuito de 6 pasos que mide la madurez digital de tu PyME en 5 frentes (presencia web, SEO local, captación, atención y automatización) y entrega un plan priorizado de acciones concretas."
          }
        }
      ]
    }
